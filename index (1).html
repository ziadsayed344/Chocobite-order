<style>
:root{--c:#6b3a17;--c2:#fdecc8;--bg:#fff8ec;--y:#e9a82b;--hd:#fdeed6;--t:#2b1a0e;--g:#8b7d70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:var(--c);display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:3px solid var(--y)}
.lg{display:flex;align-items:center;gap:10px}.lg img{height:46px}.lg b{font:700 26px Georgia,serif;direction:ltr}.lg b i{font-style:normal;color:var(--y)}
main{padding:12px}.sub{color:var(--g);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chips button{white-space:nowrap;padding:9px 16px;border-radius:99px;border:1px solid #e3d3c3;background:#fff;font-family:inherit;font-size:15px;color:var(--t)}.chips .on{background:var(--c);color:#fff;border-color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 4px #6b3a171a;padding:12px}
.pc{border:0;font-family:inherit;color:inherit;text-align:center;position:relative}.pc .im{font-size:38px;background:var(--c2);border-radius:12px;padding:14px 0;margin-bottom:8px}.pc .n{font-weight:700;font-size:15px}.pc .pr{color:var(--c);font-weight:700;margin-top:4px}
.q{position:absolute;top:8px;inset-inline-start:8px;background:var(--c);color:#fff;border-radius:99px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}
.bar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4}
.btn{background:var(--c);color:#fff;border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-family:inherit;font-weight:700;width:100%}.btn.w{background:#25d366}
input,select,textarea{width:100%;padding:12px;border:1px solid #e3d3c3;border-radius:12px;font-size:16px;font-family:inherit;background:#fff;margin:4px 0 10px}label{font-size:13px;color:var(--g)}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.row>*{margin:0}
#m{position:fixed;inset:0;background:#0006;z-index:10;display:none;align-items:flex-end}#m.on{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 12px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:10px;border:0;background:var(--c2);color:var(--c);font-size:20px}.qty input{width:56px;text-align:center;padding:7px;margin:0}

<main><div class="chips" id="ch"></div><div class="grid" id="g"></div><p class="sub" id="msg">جاري تحميل المنيو...</p></main>
<div class="bar" id="bar"></div><div id="m" onclick="if(event.target==this)cm()"></div>
<script>
const WA='201229368116',$=s=>$d.querySelector(s),$d=document,E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),M=n=>(+n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
const EM={'وافل':'🧇','الميكسات':'🍫','الطواجن':'🥘','الحلو في رغيف':'🍞','الصوصات':'🍯','الفاكهة':'🍓','البسكويت':'🍪','الإضافات':'➕'};
let P=[],cat='',cart={},info={};try{info=JSON.parse(localStorage.getItem('cb_info')||'{}')}catch(e){}
fetch('menu.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>{P=(Array.isArray(j)?j:j.products).filter(x=>x&&x.name);$('#msg').remove();draw()}).catch(()=>$('#msg').textContent='تعذر تحميل المنيو. تأكد من الإنترنت وحدّث الصفحة.');
const ck=k=>{const[i,j]=k.split('~'),p=P[+i];if(!p)return null;const o=j===undefined?null:(p.opts||[])[+j];if(j!==undefined&&!o)return null;return{name:o?p.name+' - '+o.n:p.name,price:+(o?o.price:p.price)}},qn=i=>Object.entries(cart).filter(([k])=>k.split('~')[0]==i).reduce((a,[,q])=>a+q,0);
function draw(){const cs=[...new Set(P.map(p=>p.cat||'أخرى'))];$('#ch').innerHTML=['',...cs].map(c=>`<button class="${cat===c?'on':''}" data-c="${E(c)}" onclick="cat=this.dataset.c;draw()">${c||'الكل'}</button>`).join('');
 $('#g').innerHTML=P.map((p,i)=>({p,i})).filter(x=>!cat||(x.p.cat||'أخرى')===cat).map(({p,i})=>{const n=qn(i),o=(p.opts||[]).length;return`<button class="card pc" onclick="add(${i})">${n?`<span class="q">${n}</span>`:''}<div class="im">${EM[p.cat]||'🧇'}</div><div class="n">${E(p.name)}</div><div class="pr">${o?'من '+M(Math.min(...p.opts.map(x=>+x.price))):M(p.price)}</div></button>`}).join('');bar()}
function bar(){const L=Object.entries(cart),n=L.reduce((a,[,q])=>a+q,0),t=L.reduce((a,[k,q])=>a+q*(ck(k)?.price||0),0);$('#bar').innerHTML=n?`<button class="btn" onclick="cartM()">🛒 السلة (${n}) — ${M(t)}</button>`:''}
function add(i){const p=P[i];if((p.opts||[]).length)return optM(i);addk(String(i))}
function addk(k){cart[k]=(cart[k]||0)+1;draw()}
function optM(i){const p=P[i];mo(`<h3>${E(p.name)}</h3>`+p.opts.map((o,j)=>`<button class="card row" style="width:100%;font-family:inherit;font-size:17px;border:0;margin-bottom:8px" onclick="cm();addk('${i}~${j}')"><b>${E(o.n)}</b><b style="color:var(--c)">${M(o.price)}</b></button>`).join(''))}
const mo=h=>{$('#m').innerHTML='<div class="sheet">'+h+'</div>';$('#m').classList.add('on')},cm=()=>{$('#m').classList.remove('on');$('#m').innerHTML=''};
function cq(k,d){cart[k]=(cart[k]||0)+d;if(cart[k]<=0)delete cart[k];draw();Object.keys(cart).length?cartM():cm()}
function cs(k,v){v=Math.floor(+v);if(v>0)cart[k]=v;else delete cart[k];draw();Object.keys(cart).length?cartM():cm()}
function cartM(){const L=Object.entries(cart).filter(([k])=>ck(k)),t=L.reduce((a,[k,q])=>a+q*ck(k).price,0);
 mo(`<h3>طلبك</h3>`+L.map(([k,q])=>{const c=ck(k);return`<div class="row" style="margin-bottom:10px"><div><b>${E(c.name)}</b><div class="sub">${M(c.price)}</div></div><div class="qty"><button onclick="cq('${k}',-1)">−</button><input type="number" inputmode="numeric" value="${q}" onchange="cs('${k}',this.value)"><button onclick="cq('${k}',1)">+</button></div></div>`}).join('')+
 `<div class="row" style="margin:8px 0 14px"><b>الإجمالي</b><b style="font-size:22px;color:var(--c)">${M(t)}</b></div><label>الاسم *</label><input id="nm" value="${E(info.n)}"><label>رقم الموبايل *</label><input id="ph" type="tel" inputmode="tel" value="${E(info.p)}"><label>طريقة الاستلام</label><select id="ty" onchange="$('#adw').style.display=this.value=='توصيل'?'block':'none'"><option>توصيل</option><option>استلام من المحل</option></select><div id="adw"><label>العنوان بالتفصيل *</label><input id="ad" value="${E(info.a)}"></div><label>ملاحظات (اختياري)</label><textarea id="nt" rows="2"></textarea><button class="btn w" onclick="send()">إرسال الطلب على واتساب</button><p class="sub">الأسعار بدون رسوم التوصيل، والمحل يؤكد معك السعر النهائي على واتساب.</p>`)}
function go(u){location.href=u}
function send(){const n=$('#nm').value.trim(),p=$('#ph').value.trim(),ty=$('#ty').value,a=$('#ad').value.trim(),nt=$('#nt').value.trim();
 if(!n)return alert('اكتب اسمك');if(p.replace(/\D/g,'').length<10)return alert('اكتب رقم موبايل صحيح');if(ty=='توصيل'&&!a)return alert('اكتب عنوانك');
 try{localStorage.setItem('cb_info',JSON.stringify({n,p,a}))}catch(e){}
 const L=Object.entries(cart).filter(([k])=>ck(k)),t=L.reduce((x,[k,q])=>x+q*ck(k).price,0);
 const m=['طلب جديد من موقع Chocobite 🧇','','الاسم: '+n,'الموبايل: '+p,'الاستلام: '+ty,...(ty=='توصيل'?['العنوان: '+a]:[]),'','الطلب:',...L.map(([k,q])=>{const c=ck(k);return'• '+c.name+' × '+q+' = '+(c.price*q)+' ج.م'}),'','الإجمالي: '+t+' ج.م (بدون رسوم التوصيل)',...(nt?['','ملاحظات: '+nt]:[])].join('\n');
 go('https://wa.me/'+WA+'?text='+encodeURIComponent(m))}
</script></body></html>
